<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Outer badge ring -->
  <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <!-- Fully-connected 4-node graph (complete graph K4) — mastery of all structures -->
  <!-- Edges drawn first so nodes render on top -->
  <g stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity="0.55">
    <line x1="16" y1="9"  x2="23" y2="16"/>
    <line x1="16" y1="9"  x2="16" y2="23"/>
    <line x1="16" y1="9"  x2="9"  y2="16"/>
    <line x1="23" y1="16" x2="16" y2="23"/>
    <line x1="23" y1="16" x2="9"  y2="16"/>
    <line x1="16" y1="23" x2="9"  y2="16"/>
  </g>
  <!-- Four nodes at N / E / S / W -->
  <circle cx="16" cy="9"  r="2.5" fill="currentColor"/>
  <circle cx="23" cy="16" r="2.5" fill="currentColor"/>
  <circle cx="16" cy="23" r="2.5" fill="currentColor"/>
  <circle cx="9"  cy="16" r="2.5" fill="currentColor"/>
</svg>
