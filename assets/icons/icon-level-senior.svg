<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Outer badge ring -->
  <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <!-- Binary tree: root → two children -->
  <line x1="16" y1="14" x2="10" y2="18.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="14" x2="22" y2="18.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Root node -->
  <circle cx="16" cy="11" r="3" fill="currentColor"/>
  <!-- Leaf nodes -->
  <circle cx="10" cy="21" r="2.5" fill="currentColor"/>
  <circle cx="22" cy="21" r="2.5" fill="currentColor"/>
</svg>
