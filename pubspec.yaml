name: algoowl
description: "Duolingo-inspired DSA learning app"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  flutter_animate: ^4.5.2
  confetti: ^0.8.0
  vibration: ^2.0.1
  smooth_page_indicator: ^1.2.0+3
  percent_indicator: ^4.2.3
  shimmer: ^3.0.0
  http: ^1.2.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true
